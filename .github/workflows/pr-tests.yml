name: Maven PR Tests

on:
  pull_request:
    branches:
      - main

jobs:
  format:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Apply formatting
        run: mvn -B -Pformat initialize spotless:check

  test:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build and test
        run: mvn -B clean test
