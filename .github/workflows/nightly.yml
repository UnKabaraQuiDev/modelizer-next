name: Nightly Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: [self-hosted, linux]
    outputs:
      version: ${{ steps.meta.outputs.version }}
      app_version: ${{ steps.meta.outputs.app_version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        if: github.event_name == 'schedule'
        run: |
          LOG_OUTPUT=$(git log --since='26 hours ago' --oneline -- . ':(exclude).github/**' ':(exclude)registry/**' ':(exclude)artifacts/**' || true)
          if echo "$LOG_OUTPUT" | grep -q .; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi
      - id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.changes.outputs.has_changes }}" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi
      - id: meta
        if: steps.decide.outputs.should_run == 'true'
        run: |
          source ./script/common.sh
          compute_build_metadata nightly shared
          emit_github_outputs "$GITHUB_OUTPUT"

  format:
    runs-on: [self-hosted, linux]
    needs: [prepare]
    if: github.event_name == 'workflow_dispatch' || needs.prepare.outputs.should_run == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Apply formatting
        run: mvn -B -Pformat spotless:apply
      - name: Commit & push if needed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git diff --cached --quiet || git commit -m "[bot] Apply code formatting"
          git push || echo "Push failed, continuing..."

  build-shared:
    needs: [prepare, format]
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: [self-hosted, linux]
    env:
      VERSION_OVERRIDE: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Build shared nightly artifacts
        run: bash ./script/build-nightly-shared.sh
      - uses: actions/upload-artifact@v7
        with:
          name: nightly-shared
          path: artifacts/nightly/shared/*
          if-no-files-found: error

  build-linux:
    needs: [prepare, format]
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: [self-hosted, linux]
    env:
      VERSION_OVERRIDE: ${{ needs.prepare.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        type: [bootstrap, standalone, portable]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Build Linux ${{ matrix.type }}
        run: bash ./script/build-nightly-linux-${{ matrix.type }}.sh

      - uses: actions/upload-artifact@v7
        with:
          name: nightly-linux-${{ matrix.type }}
          path: artifacts/nightly/linux-${{ matrix.type }}/*
          if-no-files-found: error

  build-windows:
    needs: [prepare, format]
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: [self-hosted, windows]
    env:
      VERSION_OVERRIDE: ${{ needs.prepare.outputs.version }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        type: [bootstrap, standalone, portable]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Build Windows ${{ matrix.type }}
        run: bash ./script/build-nightly-windows-${{ matrix.type }}.sh

      - uses: actions/upload-artifact@v7
        with:
          name: nightly-windows-${{ matrix.type }}
          path: artifacts/nightly/windows-${{ matrix.type }}/*
          if-no-files-found: error

  build-macos:
    needs: [prepare, format]
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: macos-latest
    env:
      VERSION_OVERRIDE: ${{ needs.prepare.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        type: [bootstrap, standalone, portable]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install coreutils (gdate) and Maven
        run: brew install coreutils maven

      - name: Verify
        run: |
          gdate --version
          mvn -v

      - name: Build macOS ${{ matrix.type }}
        run: bash ./script/build-nightly-macos-${{ matrix.type }}.sh

      - uses: actions/upload-artifact@v7
        with:
          name: nightly-macos-${{ matrix.type }}
          path: artifacts/nightly/macos-${{ matrix.type }}/*
          if-no-files-found: error

  publish:
    needs: [prepare, build-shared, build-linux, build-windows, build-macos]
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: [self-hosted, linux]
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: registry

      - name: Sync script files and .gitignore from main into registry
        run: |
          git fetch origin main registry
          git checkout -B registry origin/registry

          rm -rf script
          rm -f .gitignore

          git checkout origin/main -- script .gitignore

      - uses: actions/download-artifact@v8
        with:
          path: collected

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp collected/nightly-shared/* release-assets/
          cp collected/nightly-linux-bootstrap/* release-assets/
          cp collected/nightly-linux-standalone/* release-assets/
          cp collected/nightly-linux-portable/* release-assets/
          cp collected/nightly-windows-bootstrap/* release-assets/
          cp collected/nightly-windows-standalone/* release-assets/
          cp collected/nightly-windows-portable/* release-assets/
          cp collected/nightly-macos-bootstrap/* release-assets/
          cp collected/nightly-macos-standalone/* release-assets/
          cp collected/nightly-macos-portable/* release-assets/

      - name: Create or update nightly release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: release-assets/*

      - name: Update registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPOSITORY="${{ github.repository }}" RELEASE_TAG="$RELEASE_TAG" \
            python3 "$GITHUB_WORKSPACE/script/generate-assets-json.py" release-assets > assets.json

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          mkdir -p registry

          [ -f registry/release.json ] || echo '{"channel":"release","entries":[]}' > registry/release.json
          [ -f registry/snapshot.json ] || echo '{"channel":"snapshot","entries":[]}' > registry/snapshot.json
          [ -f registry/nightly.json ] || echo '{"channel":"nightly","entries":[]}' > registry/nightly.json

          bash "$GITHUB_WORKSPACE/script/update-channel-registry.sh" registry/nightly.json nightly "$VERSION" "$RELEASE_TAG" \
            "https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG" \
            "$(cat assets.json)" \
            "Latest nightly build."

          bash "$GITHUB_WORKSPACE/script/rebuild-versions-manifest.sh" registry registry/versions.json

          git add -A -f script .gitignore registry/release.json registry/snapshot.json registry/nightly.json registry/versions.json
          git commit -m "[bot] Sync scripts from main and update nightly registry to $VERSION" || exit 0
          git push origin HEAD:registry
